<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AdiGPT – Powered by Google Gemini</title>
<style>
    body {
        font-family: Arial, sans-serif;
        background: #f5f5f5;
        margin: 0;
        padding: 0;
    }
    #container {
        width: 100%;
        max-width: 480px;
        margin: auto;
        background: white;
        height: 100vh;
        display: flex;
        flex-direction: column;
        border-left: 1px solid #ccc;
        border-right: 1px solid #ccc;
    }
    #messages {
        flex: 1;
        overflow-y: auto;
        padding: 10px;
    }
    .msg {
        padding: 10px;
        margin-bottom: 8px;
        border-radius: 8px;
        max-width: 85%;
    }
    .user {
        background: #cfe3ff;
        align-self: flex-end;
    }
    .bot {
        background: #eaeaea;
        align-self: flex-start;
    }
    #inputBox {
        display: flex;
        padding: 10px;
        gap: 5px;
        background: #fff;
        border-top: 1px solid #ccc;
    }
    input, button {
        padding: 10px;
        font-size: 16px;
    }
    #apiKey {
        width: 100%;
        margin: 10px;
        padding: 10px;
    }
</style>
</head>

<body>
<div id="container">

    <input id="apiKey" placeholder="AIzaSyA5MtwyVROdKqXVf2wz2DTtJYttGcNhTtA" />

    <div id="messages"></div>

    <div id="inputBox">
        <input type="file" id="fileInput">
        <input id="textInput" placeholder="Write a message…">
        <button onclick="sendMessage()">Send</button>
    </div>

</div>

<script>
async function sendMessage() {
    const apiKey = document.getElementById("apiKey").value;
    const text = document.getElementById("textInput").value;
    const fileInput = document.getElementById("fileInput").files[0];

    if (!apiKey) {
        alert("Please enter your Gemini API Key");
        return;
    }

    if (!text && !fileInput) return;

    addMessage(text, "user");
    document.getElementById("textInput").value = "";

    let filePart = null;
    if (fileInput) {
        const fileData = await fileInput.arrayBuffer();
        filePart = {
            inlineData: {
                data: btoa(String.fromCharCode(...new Uint8Array(fileData))),
                mimeType: fileInput.type
            }
        };
    }

    const body = {
        contents: [{
            parts: [
                { text: text },
                ...(filePart ? [filePart] : [])
            ]
        }]
    };

    const response = await fetch(
        "https://generativelanguage.googleapis.com/v1beta/models/gemini-pro:generateContent?key=" + apiKey,
        {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(body)
        }
    );

    const data = await response.json();
    const reply = data.candidates?.[0]?.content?.parts?.[0]?.text || "Error reading response.";

    addMessage(reply, "bot");
}

function addMessage(text, type) {
    const box = document.getElementById("messages");
    const div = document.createElement("div");
    div.className = "msg " + type;
    div.innerText = text;
    box.appendChild(div);
    box.scrollTop = box.scrollHeight;
}
</script>
</body>
  </html>
